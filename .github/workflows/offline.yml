name: Offline checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check scripts dashboard roblox-native/tools research tests
      - name: Offline unittest suites
        run: python tests/run_offline.py
